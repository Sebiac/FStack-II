<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Funcion para llenar un arregla de numero doble al anterior

        function llenarArray() {

            const numeros = [1];
            for (let i = 0; i < 10; i++) {

                numeros.push(numeros[i] * 2)
            }
            return numeros;
        }

        console.log(llenarArray())

        // Funcion para detectar el numero mayor del arreglo


        function obtenerMayor(arreglo) {
            if (arreglo.length < 10) {
                alert("El arreglo debe tener minimo 10 elementos");
            }

            let mayor = arreglo[0];

            for (let i = 1; i < arreglo.length; i++) {
                if (arreglo[i] > mayor) {
                    mayor = arreglo[i];
                }
            }
            return mayor;
        }

        alert("El numero mayor del arreglo es " + obtenerMayor(llenarArray()))


        // Funcion para obtener el dia de la semana segun su numero (1 = lunes, 7 = domingo)

        function obtenerDia() {
            numero = parseInt(prompt("Ingrese un numero"));
            const dias = ["lunes", "martes", "miercoles", "jueves", "viernes", "sabado", "domingo"];
            if (numero < 1 || numero > 7) {
                return "Numero invalido";
            }
            return dias[numero - 1];
        }


        alert("El numero corresponde al dia " + obtenerDia());
    </script>
</body>

</html>
